[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mmrag-finance"
version = "0.1.0"
description = "Grounded multimodal retrieval for financial documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pydantic==2.14.0",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "pymupdf==1.28.2",
  "pyyaml>=6,<7",
  "rank-bm25>=0.2.2,<0.3",
  "typer==0.27.3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
models = ["faiss-cpu==1.15.1", "sentence-transformers==6.2.0", "open-clip-torch==3.3.0"]
ocr = ["pytesseract>=0.3.13,<0.4"]
tables = ["pdfplumber==0.11.10"]
app = ["streamlit==1.66.1", "pandas>=2.2,<4"]
eval = ["matplotlib>=3.9,<4"]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]
all = ["mmrag-finance[models,ocr,tables,app,eval,dev]"]

[project.scripts]
mmrag = "mmrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mmrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=mmrag --cov-report=term-missing"

[tool.coverage.run]
omit = [
  "src/mmrag/app/*",          # Streamlit executes only under its runtime
  "src/mmrag/cli.py",         # thin Typer adapter; covered by CLI smoke tests
  "src/mmrag/embedding/clip_encoder.py", # optional heavyweight production adapter
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mmrag"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pytesseract", "sentence_transformers", "streamlit", "yaml"]
ignore_missing_imports = true
